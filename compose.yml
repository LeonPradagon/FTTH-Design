services:
  server:
    build:
      context: .
      dockerfile: app/server/Dockerfile
    container_name: ftth-server
    ports:
      - "8000:8000"
    env_file:
      - .env.prod
    restart: unless-stopped
    volumes:
      - ./app/server/cache:/workspace/app/server/cache
      - ./app/server/data:/workspace/app/server/data

  web:
    build:
      context: .
      dockerfile: app/web/Dockerfile
    container_name: ftth-web
    ports:
      - "3000:3000"
    env_file:
      - app/web/.env.prod
    environment:
      FTTH_SERVER_URL: http://server:8000
    depends_on:
      - server
    restart: unless-stopped
