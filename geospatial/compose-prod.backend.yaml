services:
  migrate:
    image: ghcr.io/aidece/geospatial/backend:${IMAGE_TAG:-dev}
    pull_policy: always
    command: ["npm", "run", "db:migrate"]
    environment:
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL is required}
    restart: "no"

  backend:
    image: ghcr.io/aidece/geospatial/backend:${IMAGE_TAG:-dev}
    pull_policy: always
    ports:
      - "${BACKEND_PORT:-3000}:3000"
    environment:
      NODE_ENV: production
      PORT: ${PORT:-3000}
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:?BETTER_AUTH_SECRET is required}
      BETTER_AUTH_URL: ${BETTER_AUTH_URL:-https://geospatial.starliteindonesia.com}
      CORS_ORIGIN: ${CORS_ORIGIN:-https://geospatial.starliteindonesia.com,http://110.239.86.239}
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL is required}
      DATABASE_POOL_MAX: ${DATABASE_POOL_MAX:-10}
      SESSION_TTL_HOURS: ${SESSION_TTL_HOURS:-168}
      INITIAL_ADMIN_EMAIL: ${INITIAL_ADMIN_EMAIL:-}
      INITIAL_ADMIN_PASSWORD: ${INITIAL_ADMIN_PASSWORD:-}
      INITIAL_DESIGNER_EMAIL: ${INITIAL_DESIGNER_EMAIL:-}
      INITIAL_DESIGNER_PASSWORD: ${INITIAL_DESIGNER_PASSWORD:-}
      GRAPHHOPPER_URL: ${GRAPHHOPPER_URL:-http://graphhopper:8989}
      GRAPHHOPPER_TIMEOUT_MS: ${GRAPHHOPPER_TIMEOUT_MS:-15000}
      GRAPHHOPPER_PROFILE: ${GRAPHHOPPER_PROFILE:-motor_scooter}
    volumes:
      - ./.data:/app/.data
    depends_on:
      migrate:
        condition: service_completed_successfully
      graphhopper:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3000/health >/dev/null || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 5s
    restart: unless-stopped

  graphhopper:
    build:
      context: ./routing/graphhopper
    volumes:
      - ./.data/graphhopper:/data
    environment:
      GRAPHHOPPER_OSM_URL: ${GRAPHHOPPER_OSM_URL:-https://download.geofabrik.de/asia/indonesia-latest.osm.pbf}
      GRAPHHOPPER_FORCE_REBUILD: ${GRAPHHOPPER_FORCE_REBUILD:-false}
      JAVA_OPTS: ${GRAPHHOPPER_JAVA_OPTS:--Xmx4g}
    ports:
      - "127.0.0.1:${GRAPHHOPPER_PORT:-8989}:8989"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8989/health >/dev/null || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 120
      start_period: 30s
    restart: unless-stopped
