version: '3.8'

services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: ftth-backend
    ports:
      - "8000:8000"
    env_file:
      - .env.prod
    depends_on:
      - redis
      - db
      - minio
    restart: unless-stopped
    volumes:
      - ./backend/cache:/app/backend/cache
      - ./cache:/app/cache

  worker:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: ftth-worker
    command: ["arq", "backend.worker.WorkerSettings"]
    env_file:
      - .env.prod
    depends_on:
      - redis
      - db
      - minio
    restart: unless-stopped
    volumes:
      - ./backend/cache:/app/backend/cache
      - ./cache:/app/cache

  frontend:
    build:
      context: .
      dockerfile: dashboard/Dockerfile
    container_name: ftth-frontend
    ports:
      - "3000:3000"
    env_file:
      - dashboard/.env.prod
    depends_on:
      - backend
    restart: unless-stopped
    volumes:
      - ./dashboard/public/data:/app/dashboard/public/data

  redis:
    image: redis:7-alpine
    container_name: ftth-redis
    ports:
      - "6379:6379"
    restart: unless-stopped

  db:
    image: postgis/postgis:15-3.3-alpine
    container_name: ftth-db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password123
      POSTGRES_DB: ftth_db
    ports:
      - "5433:5432"
    volumes:
      - ftth_postgres_data:/var/lib/postgresql/data
    restart: unless-stopped

  minio:
    image: minio/minio:RELEASE.2023-11-20T22-40-07Z
    container_name: ftth-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: admin
      MINIO_ROOT_PASSWORD: password123
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - ftth_minio_data:/data
    restart: unless-stopped

  graphhopper:
    image: graphhopper/graphhopper:latest
    container_name: ftth-graphhopper
    restart: unless-stopped
    ports:
      - "8989:8989"
    environment:
      - JAVA_OPTS=-Xmx2g -Xms2g
    volumes:
      - ./graphhopper-data:/data
    command: "--url https://download.geofabrik.de/asia/indonesia-latest.osm.pbf --host 0.0.0.0"

volumes:
  ftth_postgres_data:
  ftth_minio_data:
