version: '3.8'

services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: ftth-backend
    ports:
      - "8000:8000"
    env_file:
      - .env.prod
    restart: unless-stopped
    volumes:
      - ./backend/cache:/app/backend/cache
      - ./cache:/app/cache

  frontend:
    build:
      context: .
      dockerfile: dashboard/Dockerfile
    container_name: ftth-frontend
    ports:
      - "3000:3000"
    env_file:
      - dashboard/.env.prod
    restart: unless-stopped
    volumes:
      - ./dashboard/public/data:/app/dashboard/public/data
